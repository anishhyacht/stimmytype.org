<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>StimmyType · Unlocked</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    :root { color-scheme: dark; --pink: #ff6fb5; }
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    body {
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
      color: #fff;
      text-align: center;
    }
    .backdrop {
      position: fixed;
      inset: -60px;
      background: url("photo.jpg") center / cover no-repeat;
      filter: blur(48px) brightness(0.35) saturate(1.3);
    }
    .card {
      position: relative;
      padding: 2.2rem 2.6rem;
      border-radius: 1.6rem;
      background: rgba(12, 10, 16, 0.5);
      -webkit-backdrop-filter: blur(18px) saturate(1.6);
      backdrop-filter: blur(18px) saturate(1.6);
      isolation: isolate;
      max-width: min(30rem, calc(100vw - 2rem));
    }
    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      padding: 2px;
      border-radius: inherit;
      background: conic-gradient(from var(--angle, 0deg), #bc82f3, #f5b9ea, #8d9fff, #ff6778, #ffba71, #c686ff, #bc82f3);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
      animation: spin 6s linear infinite;
      z-index: -1;
    }
    h1 { margin: 0 0 0.5rem; font-size: clamp(2rem, 6vw, 3rem); font-weight: 900; letter-spacing: -0.02em; }
    p { margin: 0.4rem 0; font-size: 1.1rem; color: rgba(255, 255, 255, 0.82); line-height: 1.45; }
    kbd {
      display: inline-block;
      padding: 0.05em 0.45em;
      border-radius: 0.35em;
      background: var(--pink);
      color: #111;
      font: 700 0.95em ui-monospace, "SF Mono", Menlo, monospace;
    }
    a { color: var(--pink); }
    @property --angle { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
    @keyframes spin { to { --angle: 360deg; } }
    @media (prefers-reduced-motion: reduce) { .card::before { animation: none; } }
  </style>
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>
  <main class="card">
    <h1>You're in.</h1>
    <p>Payment complete. StimmyType unlocks itself in a few seconds.</p>
    <p>Press <kbd>shift</kbd> + <kbd>4</kbd> to start typing.</p>
    <p style="margin-top:1.2rem;font-size:0.9rem;opacity:0.7">Still locked? Click “already paid? check again” in the app.</p>
  </main>
</body>
</html>
